{% extends "layout.html" %}
{% block content %}

<div class="container py-4 col-lg-7">

  <h2 class="fw-bold">Create Route</h2>
  <p class="text-muted">Add a new route by selecting source & destination stations.</p>
  <hr>

  <form method="post">

    <!-- Source & Destination -->
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Source Station</label>
        <select name="source_id" class="form-select" required>
          <option disabled selected value="">-- Select Source --</option>
          {% for s in stations %}
          <option value="{{ s.station_id }}">
            {{ s.station_name }} ({{ s.station_id }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Destination Station</label>
        <select name="destination_id" class="form-select" required>
          <option disabled selected value="">-- Select Destination --</option>
          {% for s in stations %}
          <option value="{{ s.station_id }}">
            {{ s.station_name }} ({{ s.station_id }})
          </option>
          {% endfor %}
        </select>
        <div class="form-text text-danger small">
          Source & destination cannot be the same.
        </div>
      </div>
    </div>

    <!-- Distance & Duration -->
    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <label class="form-label">Distance (km)</label>
        <input
          name="distance_km"
          type="number"
          step="0.1"
          class="form-control"
          placeholder="e.g. 250"
          required>
      </div>

      <div class="col-md-8">
        <label class="form-label">Duration</label>
        <input
          name="duration"
          class="form-control"
          placeholder="e.g. 06:30"
          required>
        <div class="form-text">
          Format: <b>HH:MM</b> (Hours & Minutes)
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-success px-4">Create</button>
      <a href="{{ url_for('admin.routes') }}" class="btn btn-secondary px-4">
        Back
      </a>
    </div>

  </form>
</div>

{% endblock %}
