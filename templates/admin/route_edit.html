{% extends "layout.html" %}
{% block content %}

<div class="container py-4 col-lg-7">

  <h2 class="fw-bold">Edit Route #{{ r.route_id }}</h2>
  <p class="text-muted">Update the route details below.</p>
  <hr>

  <form method="post">

    <!-- Source + Destination -->
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Source Station</label>
        <select name="source_id" class="form-select" required>
          {% for s in stations %}
          <option value="{{ s.station_id }}" {% if r.source_id == s.station_id %}selected{% endif %}>
            {{ s.station_name }} ({{ s.station_id }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label">Destination Station</label>
        <select name="destination_id" class="form-select" required>
          {% for s in stations %}
          <option value="{{ s.station_id }}" {% if r.destination_id == s.station_id %}selected{% endif %}>
            {{ s.station_name }} ({{ s.station_id }})
          </option>
          {% endfor %}
        </select>

        <div class="form-text text-danger small">
          Source & destination should not be same.
        </div>
      </div>
    </div>

    <!-- Distance + Duration -->
    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <label class="form-label">Distance (km)</label>
        <input
          name="distance_km"
          type="number"
          step="0.1"
          class="form-control"
          required
          value="{{ r.distance_km }}">
      </div>

      <div class="col-md-8">
        <label class="form-label">Duration</label>
        <input
          name="duration"
          class="form-control"
          required
          value="{{ r.duration }}">
        <div class="form-text">
          Format: <b>HH:MM</b>
        </div>
      </div>
    </div>

    <!-- Action buttons -->
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary px-4">Save</button>
      <a href="{{ url_for('admin.routes') }}" class="btn btn-secondary px-4">Back</a>
    </div>

  </form>
</div>

<!-- Optional client-side validation -->
<script>
  const src = document.querySelector("[name='source_id']");
  const dst = document.querySelector("[name='destination_id']");

  function validateStations() {
    if (src.value === dst.value) {
      dst.setCustomValidity("Source & destination cannot be same");
    } else {
      dst.setCustomValidity("");
    }
  }

  src.addEventListener("change", validateStations);
  dst.addEventListener("change", validateStations);
</script>

{% endblock %}
