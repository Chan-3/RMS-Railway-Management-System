{% extends "layout.html" %}

{% block content %}

<div class="container py-4">

  <!-- Header Row -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h2 class="fw-bold">Stations</h2>
    <a href="{{ url_for('admin.station_create') }}" class="btn btn-success">
      + Create Station
    </a>
  </div>

  <hr>

  {% if rows %}
  <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle">
      <thead class="table-light">
        <tr>
          <th style="width: 80px;">ID</th>
          <th>Name</th>
          <th style="width: 180px;">Actions</th>
        </tr>
      </thead>

      <tbody>
        {% for s in rows %}
        <tr>
          <td>{{ s.station_id }}</td>
          <td>{{ s.station_name }}</td>

          <td>
            <div class="d-flex gap-2">

              <!-- Edit -->
              <a href="{{ url_for('admin.station_edit', station_id=s.station_id) }}"
                 class="btn btn-sm btn-primary">
                ✏ Edit
              </a>

              <!-- Delete -->
              <form method="POST"
                    action="{{ url_for('admin.station_delete') }}"
                    onsubmit="return confirm('Are you sure you want to delete this station?');">
                <input type="hidden" name="station_id" value="{{ s.station_id }}">
                <button type="submit" class="btn btn-sm btn-danger">
                  🗑 Delete
                </button>
              </form>

            </div>
          </td>
        </tr>
        {% endfor %}
      </tbody>

    </table>
  </div>

  {% else %}
  <div class="alert alert-info">No stations found.</div>
  {% endif %}

  <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary mt-3">← Back</a>

</div>

{% endblock %}
